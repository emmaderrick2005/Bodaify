version: "3.9"

services:
  bodaintel:
    build: .
    container_name: bodaintel-platform
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
